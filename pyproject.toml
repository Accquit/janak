[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sih26123"
version = "0.1.0"
description = "Edge-AI based distributed fleet coordination for AMRs in smart warehouses (SIH 2026, SIH26123) - foundation stage."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["sih26123/tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]